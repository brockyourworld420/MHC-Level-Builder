name: Forge saved-browser-workspace QA

on:
  pull_request:
    paths:
      - 'asset-studio/**'
      - 'tests/forge-browser-persistence.mjs'
      - 'tests/create-forge-fixture.py'
      - '.github/workflows/forge-browser-persistence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-workspace:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install headless Chromium (no API credits)
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          google-chrome --version || google-chrome-stable --version
      - name: Real browser persistence regression
        shell: bash
        run: |
          python3 tests/create-forge-fixture.py
          python3 -m http.server 8877 --bind 127.0.0.1 > /tmp/forge-server.log 2>&1 &
          node tests/forge-browser-persistence.mjs
